<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenPanel WebUI</title>
  <style>
    :root {
      --bg: #0f1714;
      --fg: #e7f2ec;
      --muted: #9bb5a8;
      --accent: #3d9b6e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(circle at 88% 12%, rgba(61, 155, 110, 0.18), transparent 40%),
        linear-gradient(160deg, #101a16, #0b1210 60%, #121c18);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      width: min(40rem, 100%);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 4vw, 2.75rem);
      letter-spacing: 0.02em;
    }
    p {
      margin: 0.4rem 0;
      color: var(--muted);
      line-height: 1.55;
    }
    code {
      color: var(--accent);
      font-family: Consolas, "Cascadia Mono", monospace;
    }
  </style>
</head>
<body>
  <main data-open-panel="webui-root">
    <h1>OpenPanel</h1>
    <p>Server WebUI for local ops (services, sites, processes, and logs).</p>
    <p>Entry: <code>open-panel server</code> · package: <code>@wae/open-panel-webui</code>.</p>
    <p>This build is a static skeleton. Domain inventory arrives in later commits.</p>
  </main>
</body>
</html>
