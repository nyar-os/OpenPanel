[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
default-members = ["crates/core", "crates/napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["OpenPanel Authors"]
repository = "https://github.com/nyar-os/OpenPanel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "b5d555cc9f492858c602b62c3bd46a6be69012d4" }
open-panel-core = { path = "crates/core", version = "0.0.0" }

[profile.release]
lto = true
panic = "abort"
