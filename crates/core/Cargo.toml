[package]
name = "open-panel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenPanel domain core (local ops panel semantics)"
publish = false

[features]
default = []
# Optional thin re-export of the ACME helper crate for server callers.
auto-ssl = ["dep:auto-ssl"]

[dependencies]
auto-ssl = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Services",
] }

[dev-dependencies]
tempfile = { workspace = true }
